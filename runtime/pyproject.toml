[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-runtime"
version = "0.2.0"
description = "pytest plugin: fork workers from a warmed process, input-keyed result cache, fail-fast, job telemetry"
requires-python = ">=3.9"
dependencies = ["pytest>=7"]
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["agentic_runtime"]
